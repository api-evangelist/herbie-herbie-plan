aid: herbie-herbie-plan
name: Herbie, Herbie Plan
description: >-
  Herbie is an AI-powered estate planning platform and law firm that lets
  individuals and partner organizations create wills, trusts, and related legal
  documents online. Its agentic engine encodes the principles, laws, and
  practice of estate planning into a system that drafts and assembles documents
  at scale, paired with an AI copilot for natural-language guidance and optional
  attorney review through Herbie Legal. Herbie is offered directly to consumers
  and as an embeddable "estate planning as a service" offering for wealth
  management firms, insurance companies, and employers. Herbie was surfaced as a
  portfolio company of 500 Global and added to the API Evangelist network.
